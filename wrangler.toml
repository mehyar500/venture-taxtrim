# TaxTrim — taxtrim.mehyar.us
# Bindings live HERE (in the repo) so every Pages deploy carries them.
# Only true secrets stay dashboard-managed. Never `wrangler pages deploy`
# from a checkout — this project deploys via Pages GitHub integration.
name = "venture-taxtrim"
pages_build_output_dir = "."
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "mehyar_leads_prod"
database_id = "e4f22065-e3e8-4772-87a8-51d4976be042"

[ai]
binding = "AI"
