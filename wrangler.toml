# TaxTrim Pages project config.
# name + compatibility_date ONLY. NO [vars] section — secrets and plain env
# vars are managed via the Cloudflare API by
# ~/workspace/ventures/_ops/deploy_product.py (GET-merge-PATCH), because a
# [vars] section in this file would REPLACE the project's dashboard env vars
# on `wrangler pages deploy` (see mehyar-web incident in AGENTS.md).
# Bindings are likewise set by the deploy script, not here, so this file
# stays product-agnostic and secret-free.
name = "taxtrim"
compatibility_date = "2026-09-20"
